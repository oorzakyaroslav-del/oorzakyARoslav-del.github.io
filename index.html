<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: white; text-align: center; margin: 0; padding: 50px 20px; }
        h1 { color: #e94560; font-size: 28px; }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: inline-block;
            background: #0f3460;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .site-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #e94560;
        }
        .message {
            background-color: #0f3460;
            padding: 15px;
            border-radius: 8px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет!</h1>
        
        <!-- Картинка -->
        <img src="photo.jpg" alt="Фото" class="site-image">
        
        <!-- Сообщение -->
        <div class="message">
            Айдыс баба
        </div>

        <!-- Кнопка с переходом в Telegram -->
        <a href="https://t.me/GRAM1448" target="_blank" class="btn">Связаться со мной</a>
    </div>
</body>
</html>
