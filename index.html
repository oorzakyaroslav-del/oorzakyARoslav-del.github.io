<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт Моего Короля</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 { color: #e94560; font-size: 28px; }
        p { font-size: 18px; line-height: 1.6; }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: inline-block;
            background: #0f3460;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, мой Король!</h1>
        <p>Это мой первый сайт, который я сделал прямо на телефоне. Здесь будет мой контент.</p>
        <a href="#" class="btn">Связаться со мной</a>
    </div>
</body>
</html>
